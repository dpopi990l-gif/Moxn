name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Project Files Cleanly
      run: |
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/java/com/filmx/app
        
        printf "include(\":app\")\n" > settings.gradle.kts
        
        printf "plugins {\n    id(\"com.android.application\") version \"8.2.0\" apply false\n}\n" > build.gradle.kts

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
        }
        android {
            namespace = "com.filmx.app"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.filmx.app"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:label="@string/app_name"
                android:theme="@android:style/Theme.NoTitleBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        printf '<resources><string name="app_name">فيلمكس</string></resources>\n' > app/src/main/res/values/strings.xml

        cat << 'EOF' > app/src/main/java/com/filmx/app/MainActivity.kt
        package com.filmx.app
        import android.app.Activity
        import android.os.Bundle
        import android.widget.TextView
        class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val tv = TextView(this)
                tv.text = "مرحباً بك في تطبيق فيلمكس"
                setContentView(tv)
            }
        }
        EOF

    - name: Setup Gradle Wrapper
      run: |
        gradle_version=8.5
        curl -sLO https://services.gradle.org/distributions/gradle-${gradle_version}-bin.zip
        unzip -q gradle-${gradle_version}-bin.zip
        gradle-${gradle_version}/bin/gradle wrapper --gradle-version ${gradle_version}

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: فيلمكس
        path: app/build/outputs/apk/debug/app-debug.apk
         
