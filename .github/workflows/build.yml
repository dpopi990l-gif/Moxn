
name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
  
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create App Structure and Set Name FilmX
      run: |
        mkdir -p app/src/main/res/values
        echo '<resources><string name="app_name">فيلمكس</string></resources>' > app/src/main/res/values/strings.xml

    - name: Create Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Secrets
      env:
        TMDB_KEY: ${{ secrets.TMDB_KEY }}
        PANEL_BASE_URL: ${{ secrets.PANEL_BASE_URL }}
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: فيلمكس
        path: app/build/outputs/apk/debug/app-debug.apk
